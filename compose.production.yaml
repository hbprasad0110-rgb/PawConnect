name: pawconnect-production

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the production environment file}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the production environment file}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the production environment file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the production environment file}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - pawconnect_production_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s
    networks:
      - pawconnect-production

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in the production environment file}
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in the production environment file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the production environment file}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the production environment file}
      DB_NAME_TEST: ${DB_NAME_TEST:?Set DB_NAME_TEST in the production environment file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the production environment file}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in the production environment file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the production environment file}
      DEMO_ADOPTER_EMAIL: ${DEMO_ADOPTER_EMAIL:?Set DEMO_ADOPTER_EMAIL in the production environment file}
      DEMO_ADOPTER_PASSWORD: ${DEMO_ADOPTER_PASSWORD:?Set DEMO_ADOPTER_PASSWORD in the production environment file}
      EMAIL_MODE: ${EMAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-PawConnect Support <supportpawconnect@gmail.com>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-supportpawconnect@gmail.com}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pawconnect-production

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_ENABLE_DEMO_LOGIN: ${VITE_ENABLE_DEMO_LOGIN:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pawconnect-production

volumes:
  pawconnect_production_mysql_data:
    name: pawconnect_production_mysql_data

networks:
  pawconnect-production:
    name: pawconnect-production
